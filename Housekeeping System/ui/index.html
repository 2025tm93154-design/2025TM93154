<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Housekeeping System Dashboard</title>
    <style>
      :root {
        --bg: #f3f7fb;
        --panel: #ffffff;
        --line: #dfe9f5;
        --primary: #234c8f;
        --success: #1f9d61;
        --error: #d64545;
        --text: #17324d;
        --muted: #61758a;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(20, 54, 90, 0.08);
        padding: 24px;
      }

      h1, h2, h3 {
        margin-top: 0;
        color: var(--primary);
      }

      .status-banner {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .status-success {
        background: rgba(31, 157, 97, 0.12);
        color: var(--success);
      }

      .status-error {
        background: rgba(214, 69, 69, 0.12);
        color: var(--error);
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 18px 0 24px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: bold;
        cursor: pointer;
        background: #edf3ff;
        color: var(--primary);
      }

      button.primary { background: var(--primary); color: #fff; }
      button.success { background: var(--success); color: #fff; }
      button.danger { background: var(--error); color: #fff; }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .actions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .action-card {
        border: 1px solid var(--line);
        background: #f9fbff;
        border-radius: 12px;
        padding: 16px;
      }

      .action-card button {
        width: 100%;
        margin-top: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }

      th, td {
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      th {
        background: #eef4fb;
      }

      .badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
      }

      .badge-success {
        background: rgba(31, 157, 97, 0.12);
        color: var(--success);
      }

      .badge-error {
        background: rgba(214, 69, 69, 0.12);
        color: var(--error);
      }

      pre {
        background: #f8fbff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>Housekeeping System Dashboard</h1>
        <div id="overallStatus" class="status-banner">Loading run status...</div>

        <div class="button-row">
          <button data-action="refresh" class="primary">Refresh status</button>
          <button data-action="start" class="success">Start all services</button>
          <button data-action="stop" class="danger">Stop all services</button>
          <button data-action="run-suite" class="primary">Run failure suite & open report</button>
        </div>

        <div class="actions-grid">
          <div class="action-card">
            <h3>Reservation Service</h3>
            <button data-action="reservation">Create sample reservation</button>
          </div>
          <div class="action-card">
            <h3>Room Service</h3>
            <button data-action="room-hold">Create room hold</button>
          </div>
          <div class="action-card">
            <h3>Task Service</h3>
            <button data-action="task">Create housekeeping task</button>
          </div>
          <div class="action-card">
            <h3>Notification Service</h3>
            <button data-action="notification">Send notification</button>
          </div>
        </div>

        <div class="panel" style="margin-top: 20px; padding: 20px;">
          <h2>Request a service</h2>
          <div style="display: grid; gap: 14px; max-width: 700px;">
            <label>
              <div style="font-weight: bold; margin-bottom: 8px;">Choose service</div>
              <select id="serviceSelect" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);">
                <option value="reservation">Reservation Service</option>
                <option value="room-hold">Room Service</option>
                <option value="task">Task Service</option>
                <option value="notification">Notification Service</option>
              </select>
            </label>

            <div id="dynamicFields"></div>

            <button id="submitServiceRequest" class="primary" type="button">Send request</button>
          </div>
        </div>

        <div class="panel" style="margin-top: 20px; padding: 20px;">
          <h2>Update task status</h2>
          <div style="display: grid; gap: 14px; max-width: 700px;">
            <label>
              <div style="font-weight: bold; margin-bottom: 8px;">Select task</div>
              <select id="taskStatusTask" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);">
                <option value="">Loading tasks...</option>
              </select>
            </label>

            <label>
              <div style="font-weight: bold; margin-bottom: 8px;">New status</div>
              <select id="taskStatusValue" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);">
                <option value="PENDING">PENDING</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="COMPLETED">COMPLETED</option>
                <option value="CANCELLED">CANCELLED</option>
              </select>
            </label>

            <button id="updateTaskStatus" class="success" type="button">Update status</button>
            <pre id="taskStatusOutput">Loading task list...</pre>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Component</th>
              <th>Endpoint</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="serviceRows"></tbody>
        </table>

        <h2>Run report</h2>
        <pre id="reportOutput">Waiting for report...</pre>

        <h2>Action output</h2>
        <pre id="actionOutput">No actions triggered yet.</pre>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
